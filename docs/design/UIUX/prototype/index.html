function modalAction(spec){const [action,id]=spec.split(':');let plugin=market.find(x=>x.id===id)||plugins.find(x=>x.id===id);if(action==='install')return modal('安装扩展 · 第一步：风险审查',`<b>${plugin?plugin.name:'扩展'}</b><p>来源：${plugin?.author||'未知'}<br/>版本：${plugin?.version||'未知'}</p><div class="notice warn">安装前必须检查软件来源、依赖差异及权限。安装完成后默认保持未启用。<br/>这是离线演示，确认不会实际安装。</div>`,'确认模拟安装');if(action==='uninstall')return modal('确认卸载',`请确认是否从当前实例移除 <b>${id}</b>。正式操作必须提供依赖检查和可恢复策略。`,'模拟卸载');if(action==='dependency'||action==='applyUpdates')return modal('依赖变更确认',`<div class="notice warn">将执行版本兼容性检测、创建备份并在必要时重启服务。这些动作在离线演示中均不会运行。</div>`,'模拟应用');if(action==='manual')return modal('手动安装扩展',`<div class="small muted">仓库地址（仅演示输入）</div><input class="field" style="width:100%;margin:8px 0 12px" placeholder="https://github.com/example/plugin"/><div class="notice">正式流程需支持 ZIP 或签名仓库来源，并展示权限与依赖审查。</div>`,'下一步');if(action==='json')return modal('JSON 配置预览',`<pre class="mono" style="background:#f5f6fa;padding:14px;overflow:auto">{\n  "profile": "default",\n  "model": "cloud-1",\n  "isolation": "channel-user",\n  "max_tool_rounds": 8\n}</pre><p class="muted small">示意结构，非后端数据。</p>`,'关闭');if(action==='approve'||action==='deny')return modal(action==='approve'?'审批范围确认':'拒绝请求',`请求 ID：<b>${id}</b><br/>该操作必须由服务端核验审批人身份、能力范围与请求状态。<br/><div class="notice warn">演示确认不会执行任何外部动作。</div>`,'确认（演示）');if(action==='channel')return modal('修改渠道状态',`此操作仅修改离线示例中的展示状态，正式操作必须等待后端实际连接结果。`,'模拟操作');return modal('操作确认','这是离线 UI/UX 原型。正式操作必须连接真实后端。','确认（演示)')}

function act(a){if(a.startsWith('nav:'))return setPage(a.slice(4));if(a.startsWith('toast:'))return toast(a.slice(6));if(a.startsWith('extTab:')){state.tab=({'已安装':'installed','插件市场':'market'})[a.slice(7)]||a.slice(7);state.pluginSearch='';state.pluginCategory='全部';return render()}if(a.startsWith('configTab:')){state.configTab=a.slice(10);return render()}if(a.startsWith('identityTab:')){state.identityTab=a.slice(12);return render()}if(a.startsWith('tasksTab:')){state.tasksTab=a.slice(9);return render()}if(a.startsWith('dataTab:')){state.dataTab=a.slice(8);return render()}if(a.startsWith('pickPlugin:')){state.selectedPlugin=a.slice(11);state.dirty=false;return render()}if(a.startsWith('pickProvider:')){state.selectedProvider=a.slice(13);return render()}if(a.startsWith('pickPlatform:')){state.selectedPlatform=a.slice(13);return render()}if(a.startsWith('pickMemory:')){state.selectedMemory=+a.slice(11);return render()}if(a.startsWith('pickTrace:')){state.selectedTrace=a.slice(10);return render()}if(a.startsWith('togglePlugin:')){const p=plugins.find(x=>x.id===a.slice(13));if(p){p.enabled=!p.enabled;toast(`演示：${p.name} 已${p.enabled?'启用':'停用'}（未连接后端）`);render()}return}if(a==='modal:manual')return modalAction('manual');if(a.startsWith('modal:'))return modalAction(a.slice(6));if(a==='closeModal'){document.getElementById('overlay').innerHTML='';return}if(a==='confirmModal'){document.getElementById('overlay').innerHTML='';toast('仅在本地演示操作流程；未执行生产变更。');return}if(a==='resetDirty'){state.dirty=false;return render()}if(a==='saveDirty'){state.dirty=false;toast('演示保存：未写入后端');return render()}if(a==='saveConfig'){state.configDirty=false;toast('演示配置已保存（仅前端模拟）');return render()}if(a==='resetConfig'){state.configDirty=false;return render()}if(a==='runSandbox'){let el=document.getElementById('sandboxOutput');const input=document.getElementById('sandboxPrompt')?.value||'';if(el)el.innerHTML=`<div class="notice">模拟测试已结束。输入长度 ${input.length} 字符；未调用真实模型。</div><h4 class="section-title">执行流程</h4><div class="listline">1. 解析用户输入 ${badge('已完成','good')}</div><div class="listline">2. 提取意图与权限需求 ${badge('已完成','good')}</div><div class="listline">3. 输出建议而非执行外部操作 ${badge('沙盒','blue')}</div><h4 class="section-title">模拟回复</h4><p style="line-height:1.8">我会先整理所需信息，并列出需要授权的读取或写入操作。在没有明确批准之前，不会执行外部改动。</p>`;return}if(a==='resetSandbox'){setPage('console');return}}
document.addEventListener('click',e=>{let n=e.target.closest('[data-action]');if(n){e.preventDefault();return act(n.dataset.action)}let page=e.target.closest('[data-page]');if(page){e.preventDefault();return setPage(page.dataset.page)}if(e.target.id==='menuButton'){state.menu=!state.menu;return renderNav()}if(e.target.classList.contains('modal-back'))act('closeModal')});
document.addEventListener('input',e=>{if(e.target.matches('[data-dirty]')){let was=state.dirty;state.dirty=true;if(!was){let form=e.target.closest('.right-form');if(form){form.insertAdjacentHTML('beforeend',`<div class="savebar" id="fastSavebar"><b>● 有未保存修改</b><span class="ml-auto"></span>${btn('撤销修改','resetDirty')}${btn('保存配置（演示）','saveDirty','primary')}</div>`)}}}if(e.target.matches('[data-config]')){let was=state.configDirty;state.configDirty=true;if(!was){let form=e.target.closest('.right-form');if(form)form.insertAdjacentHTML('beforeend',`<div class="savebar"><b>● 有未保存的配置</b><span class="ml-auto"></span>${btn('撤销修改','resetConfig')}${btn('保存配置（演示）','saveConfig','primary')}</div>`)}}if(e.target.id==='simpleTableSearch'){const q=e.target.value.toLowerCase();document.querySelectorAll('.table tbody tr').forEach(row=>row.style.display=row.innerText.toLowerCase().includes(q)?'':'none')}if(e.target.id==='pluginSearch'){state.pluginSearch=e.target.value;let start=e.target.selectionStart;render();let input=document.getElementById('pluginSearch');if(input){input.focus();input.setSelectionRange(start,start)}}if(e.target.id==='traceSearch'){state.traceSearch=e.target.value;let start=e.target.selectionStart;render();let input=document.getElementById('traceSearch');if(input){input.focus();input.setSelectionRange(start,start)}}if(e.target.id==='memorySearch'){const q=e.target.value.toLowerCase();document.querySelectorAll('#memoryList .split-item').forEach(n=>n.style.display=n.innerText.toLowerCase().includes(q)?'':'none')}});
document.addEventListener('change',e=>{if(e.target.id==='pluginCategory'){state.pluginCategory=e.target.value;return render()}if(e.target.id==='marketSort'){state.marketSort=e.target.value==='名称'?'名称':'default';return render()}});
window.addEventListener('hashchange',()=>{let p=location.hash.replace('#','');if(titles[p]&&p!==state.page){state.page=p;render()}});
state.page=titles[location.hash.slice(1)]?location.hash.slice(1):'extensions';render();
</script></body></html>
